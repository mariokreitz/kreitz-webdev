<div role="status" class="flex flex-col gap-2" [attr.aria-label]="'common.loading' | translate">
  @switch (variant()) {
    @case ('metric') {
      <div class="h-3 w-20 animate-pulse rounded-(--radius) bg-(--color-surface-container-high)"></div>
      <div class="mt-2 h-7 w-12 animate-pulse rounded-(--radius) bg-(--color-surface-container-high)"></div>
      <div class="mt-1 h-3 w-24 animate-pulse rounded-(--radius) bg-(--color-surface-container-high)"></div>
    }
    @case ('activity') {
      <div class="h-6 w-40 animate-pulse rounded-(--radius) bg-(--color-surface-container-high)"></div>
      <div class="mt-4 flex flex-col gap-3">
        @for (row of rowIndexes(); track row) {
          <div
            class="flex items-center justify-between border-b border-(--color-outline-variant) pb-3 last:border-0 last:pb-0">
            <div class="h-4 w-32 animate-pulse rounded-(--radius) bg-(--color-surface-container-high)"></div>
            <div class="h-3 w-16 animate-pulse rounded-(--radius) bg-(--color-surface-container-high)"></div>
          </div>
        }
      </div>
    }
    @default {
      never
    }
  }
</div>
