<button
  class="flex w-full items-center justify-center gap-2 rounded-[var(--radius)] border border-[var(--color-outline-variant)] bg-[var(--color-surface-container-high)] px-4 py-2.5 font-mono text-label-caps uppercase text-[var(--color-on-surface)] transition-colors enabled:hover:bg-[var(--color-surface-container-highest)] disabled:cursor-not-allowed disabled:opacity-60"
  type="button"
  [disabled]="disabled() || loading()"
  (click)="buttonClick.emit()">
  <span class="flex h-5 w-5 shrink-0 items-center justify-center">
    @if (loading()) {
      <kwd-ui-spinner size="sm" />
    } @else {
      <fa-icon class="text-lg" [icon]="icon()" />
    }
  </span>
  <span>{{ loading() ? loadingLabel() : label() }}</span>
</button>
