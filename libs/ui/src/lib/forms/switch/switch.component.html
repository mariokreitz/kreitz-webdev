<button
  type="button"
  role="switch"
  [class]="
    `relative inline-flex h-7 w-14 shrink-0 items-center rounded-(--radius-full) border transition-[background-color,border-color,transform] duration-300 motion-reduce:transition-none hover:brightness-110 active:scale-95 motion-reduce:active:scale-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-primary)] ${checked() ? 'border-transparent bg-(--color-primary)' : 'border-(--color-outline-variant) bg-(--color-surface-container-high)'}`
  "
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || null"
  (click)="checkedChange.emit(!checked())">
  <span
    [class]="
      `relative inline-flex h-5 w-5 items-center justify-center rounded-(--radius-full) bg-(--color-surface-container-lowest) shadow transition-transform duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)] motion-reduce:transition-none motion-reduce:duration-0 ${checked() ? 'translate-x-8' : 'translate-x-1'}`
    ">
    @if (checkedIcon(); as onIcon) {
      <fa-icon
        aria-hidden="true"
        [class]="
          `absolute text-[10px] text-(--color-primary) transition-[opacity,transform] duration-300 motion-reduce:transition-none ${checked() ? 'scale-100 rotate-0 opacity-100' : 'scale-50 rotate-45 opacity-0'}`
        "
        [icon]="onIcon" />
    }
    @if (uncheckedIcon(); as offIcon) {
      <fa-icon
        aria-hidden="true"
        [class]="
          `absolute text-[10px] text-(--color-warning) transition-[opacity,transform] duration-300 motion-reduce:transition-none ${checked() ? 'scale-50 -rotate-45 opacity-0' : 'scale-100 rotate-0 opacity-100'}`
        "
        [icon]="offIcon" />
    }
  </span>
</button>
