<aside
  class="hidden h-full w-64 shrink-0 flex-col overflow-y-auto border-r border-(--color-outline-variant) bg-(--color-surface-container-low) md:flex">
  <div class="px-4 py-5 text-headline-md text-(--color-on-surface)">kreitz webdev</div>

  <nav class="flex flex-1 flex-col gap-1 px-3">
    @for (item of items(); track item.route + item.label) {
      <kwd-ui-nav-item [icon]="item.icon" [label]="item.label" [route]="item.route" />
    }
  </nav>

  @if (user(); as u) {
    <kwd-ui-user-chip [user]="u" (signOut)="signOut.emit()" />
  }
</aside>

<nav
  class="fixed inset-x-0 bottom-0 z-40 flex items-center justify-around border-t border-(--color-outline-variant) bg-(--color-surface-container-low) pb-[calc(0.5rem+var(--spacing-safe-bottom))] pt-2 md:hidden">
  @for (item of items(); track item.route + item.label) {
    <kwd-ui-nav-item variant="bottom-nav" [icon]="item.icon" [label]="item.label" [route]="item.route" />
  }
</nav>
