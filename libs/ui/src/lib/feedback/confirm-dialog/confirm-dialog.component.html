@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" role="presentation">
    <div
      class="w-full max-w-sm rounded-(--radius-lg) border border-(--color-outline-variant) bg-(--color-surface-container-low) p-6"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="title()">
      <h2 class="text-headline-md text-(--color-on-surface)">{{ title() }}</h2>
      <p class="mt-2 text-body-sm text-(--color-on-surface-variant)">{{ message() }}</p>

      <div class="mt-6 flex justify-end gap-3">
        <button
          class="rounded-(--radius) px-4 py-2.5 text-label-caps uppercase text-(--color-on-surface-variant) transition-colors hover:text-(--color-on-surface) disabled:cursor-not-allowed disabled:opacity-60"
          type="button"
          [disabled]="busy()"
          (click)="onCancel()">
          {{ 'common.cancel' | translate }}
        </button>
        <button
          class="rounded-(--radius) border border-(--color-error) px-4 py-2.5 text-label-caps uppercase text-(--color-error) transition-colors enabled:hover:bg-(--color-error) enabled:hover:text-(--color-on-error) disabled:cursor-not-allowed disabled:opacity-60"
          type="button"
          [disabled]="busy()"
          (click)="onConfirm()">
          {{ busy() ? ('common.processing' | translate) : confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
