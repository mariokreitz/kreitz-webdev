<button
  class="relative flex w-full items-center justify-center gap-2 overflow-hidden rounded-(--radius) bg-secondary-500 px-4 py-2.5 font-mono text-label-caps uppercase text-on-secondary-container transition-colors enabled:hover:-translate-y-px enabled:hover:bg-secondary-400 enabled:hover:brightness-[1.03] enabled:active:translate-y-0 enabled:active:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-primary)] disabled:cursor-not-allowed disabled:opacity-60"
  type="submit"
  [disabled]="disabled() || loading()">
  <span class="flex h-5 w-5 shrink-0 items-center justify-center">
    @if (loading()) {
      <span
        class="inline-block h-3.5 w-3.5 animate-[spin_0.8s_linear_infinite] rounded-full border-2 border-[rgba(2,6,23,0.3)] border-t-current"
        [attr.aria-label]="'common.processing' | translate"></span>
    } @else {
      <fa-icon class="text-lg" [icon]="icon()" />
    }
  </span>
  <span>{{ loading() ? loadingLabel() : label() }}</span>
</button>
