<header
  class="sticky top-0 z-30 flex items-center justify-between border-b border-(--color-outline-variant) bg-(--color-surface) px-4 py-3 md:px-6">
  <span class="text-headline-md text-(--color-on-surface) md:hidden">kreitz webdev</span>

  <div class="ml-auto flex items-center gap-3">
    <kwd-ui-theme-toggle [theme]="theme()" (toggleTheme)="toggleTheme.emit()" />

    @if (user()) {
      <button
        class="flex h-11 w-11 items-center justify-center rounded-(--radius-full) border border-(--color-outline-variant) bg-(--color-surface-container-high) text-(--color-on-surface-variant) transition-colors hover:bg-(--color-surface-container-highest) active:bg-(--color-surface-container-highest) md:hidden"
        type="button"
        [attr.aria-label]="'common.signOut' | translate"
        (click)="signOut.emit()">
        <fa-icon class="text-base" [icon]="signOutIcon" />
      </button>
    }
  </div>
</header>
