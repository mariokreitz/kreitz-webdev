<div class="flex items-center gap-3 border-t border-(--color-outline-variant) px-3 py-4">
  <span
    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-(--radius-full) bg-(--color-primary) text-code-sm text-(--color-on-primary)">
    {{ initials() }}
  </span>
  <span class="flex min-w-0 flex-1 flex-col">
    <span class="truncate text-body-sm text-(--color-on-surface)">{{ user().name }}</span>
    <span class="truncate text-code-sm text-(--color-on-surface-variant)">{{ user().email }}</span>
  </span>
  <button
    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-(--radius-md) text-(--color-on-surface-variant) transition-colors hover:bg-(--color-surface-container-high) hover:text-(--color-on-surface)"
    type="button"
    aria-label="Sign out"
    (click)="signOut.emit()">
    <fa-icon class="text-base" [icon]="signOutIcon" />
  </button>
</div>
