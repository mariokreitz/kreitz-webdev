<button
  class="flex h-10 w-10 items-center justify-center rounded-[var(--radius-full)] border border-[var(--color-outline-variant)] bg-[var(--color-surface-container-high)] text-[var(--color-on-surface-variant)] transition-colors hover:bg-[var(--color-surface-container-highest)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-primary)]"
  type="button"
  [attr.aria-label]="label()"
  (click)="toggleTheme.emit()">
  <fa-icon class="text-base" [icon]="icon()" />
</button>
