<a
  class="flex items-center rounded-(--radius-md) px-3 py-2 text-body-sm text-(--color-on-surface-variant) transition-colors hover:bg-(--color-surface-container-high) hover:text-(--color-on-surface)"
  routerLinkActive="bg-(--color-surface-container-high) text-(--color-on-surface)"
  [class.flex-col]="variant() === 'bottom-nav'"
  [class.justify-center]="variant() === 'bottom-nav'"
  [class.gap-1]="variant() === 'bottom-nav'"
  [class.gap-3]="variant() === 'sidebar'"
  [routerLink]="route()">
  <fa-icon class="text-base" [icon]="icon()" />
  <span [class.text-code-sm]="variant() === 'bottom-nav'">{{ label() }}</span>
</a>
