name: Build and Push Docker Image

description: Build a Docker image and push it to GitHub Container Registry

inputs:
  image:
    description: Full Docker image name, e.g. ghcr.io/my-org/my-app
    required: true

  username:
    description: Username used to authenticate with GHCR
    required: true

  password:
    description: Token used to authenticate with GHCR
    required: true

  context:
    description: Docker build context
    required: false
    default: .

  dockerfile:
    description: Path to the Dockerfile
    required: false
    default: ./Dockerfile

runs:
  using: composite

  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Generate Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.image }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max