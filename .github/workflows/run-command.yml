name: Run command

on:
  workflow_call:
    inputs:
      label:
        description: Human-readable label for this job, used in the job name and step summary
        required: true
        type: string
      command:
        description: Shell command to execute after the workspace is installed
        required: true
        type: string

jobs:
  run:
    name: ${{ inputs.label }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Write throwaway env file
        run: echo 'DATABASE_URL="postgresql://build:build@localhost:5432/build"' > .env.local

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ${{ inputs.label }}
        id: command
        run: ${{ inputs.command }}

      - name: Write job summary
        if: always()
        env:
          LABEL: ${{ inputs.label }}
          OUTCOME: ${{ steps.command.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "✅ $LABEL passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ $LABEL failed" >> "$GITHUB_STEP_SUMMARY"
          fi
