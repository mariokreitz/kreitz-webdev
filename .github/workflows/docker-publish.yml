name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        description: Build and deploy every service regardless of what Nx/Docker detect as affected
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    uses: ./.github/workflows/run-command.yml
    with:
      label: Typecheck
      command: npx nx affected -t tsc

  format:
    name: Format
    uses: ./.github/workflows/run-command.yml
    with:
      label: Format
      command: npm run format:check

  lint:
    name: Lint
    uses: ./.github/workflows/run-command.yml
    with:
      label: Lint
      command: npx nx affected -t lint

  i18n:
    name: I18n
    uses: ./.github/workflows/run-command.yml
    with:
      label: I18n
      command: npm run i18n:check

  test:
    name: Test
    needs: [typecheck, format, lint, i18n]
    uses: ./.github/workflows/run-command.yml
    with:
      label: Test
      command: npx nx affected -t test

  detect:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      node_version: ${{ steps.detect.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Check Node version drift between .nvmrc and Dockerfiles
        run: |
          set -euo pipefail
          nvmrc_major="$(cut -d. -f1 .nvmrc | tr -d '[:space:]v')"
          status=0
          for dockerfile in docker/kwd.api.Dockerfile docker/kwd.portal.Dockerfile docker/kwd.frontend.Dockerfile; do
            docker_major="$(grep -m1 '^ARG NODE_IMAGE=' "$dockerfile" | cut -d: -f2 | cut -d- -f1)"
            if [ "$docker_major" != "$nvmrc_major" ]; then
              echo "::error file=$dockerfile::NODE_IMAGE major version ($docker_major) does not match .nvmrc ($nvmrc_major)"
              status=1
            fi
          done
          exit "$status"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Detect affected services
        id: detect
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail

          node_version="$(tr -d '[:space:]v' < .nvmrc)"
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"

          registry='[
            {"service":"api","dockerfile":"docker/kwd.api.Dockerfile","deploy_webhook_secret":"DOKPLOY_DEPLOY_WEBHOOK_API"},
            {"service":"portal","dockerfile":"docker/kwd.portal.Dockerfile","deploy_webhook_secret":"DOKPLOY_DEPLOY_WEBHOOK_PORTAL"},
            {"service":"frontend","dockerfile":"docker/kwd.frontend.Dockerfile","deploy_webhook_secret":"DOKPLOY_DEPLOY_WEBHOOK_FRONTEND"}
          ]'

          if [ "$FORCE_ALL" = "true" ]; then
            services="$(echo "$registry" | jq -c '.')"
          else
            affected_apps="$(npx nx show projects --affected --type app --json)"

            services="$(echo "$registry" | jq -c --argjson affected "$affected_apps" \
              'map(select(.service as $s | $affected | index($s) != null))')"

            extra="[]"
            while IFS= read -r row; do
              dockerfile="$(echo "$row" | jq -r '.dockerfile')"
              if ! git diff --quiet "$NX_BASE" "$NX_HEAD" -- "$dockerfile"; then
                extra="$(echo "$extra" | jq -c --argjson row "$row" '. + [$row]')"
              fi
            done < <(echo "$registry" | jq -c '.[]')

            services="$(jq -cn --argjson a "$services" --argjson b "$extra" '($a + $b) | unique_by(.service)')"
          fi

          echo "services=$services" >> "$GITHUB_OUTPUT"

  docker-build:
    name: Build & push (${{ matrix.service }})
    needs: [test, detect]
    if: needs.test.result == 'success' && needs.detect.result == 'success' && needs.detect.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.services) }}
    uses: ./.github/workflows/docker-build-deploy.yml
    with:
      service: ${{ matrix.service }}
      dockerfile: ${{ matrix.dockerfile }}
      deploy_webhook_secret: ${{ matrix.deploy_webhook_secret }}
      node_version: ${{ needs.detect.outputs.node_version }}
    secrets: inherit

  gate:
    name: Gate
    needs: [typecheck, format, lint, i18n, test, detect, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check pipeline result
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "Pipeline failed — see the failing job(s) above."
            exit 1
          fi
