name: Build & push

on:
  workflow_call:
    inputs:
      service:
        description: Service name, used for the image tag and cache scope
        required: true
        type: string
      dockerfile:
        description: Path to the service's Dockerfile
        required: true
        type: string
      deploy_webhook_secret:
        description: Name of the secret holding the Dokploy deploy webhook URL for this service
        required: true
        type: string
      node_version:
        description: Node major version to bake into the image via the NODE_IMAGE build-arg
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push (${{ inputs.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE=node:${{ inputs.node_version }}-slim
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Trigger Dokploy deploy
        if: github.event_name != 'pull_request'
        env:
          WEBHOOK_URL: ${{ secrets[inputs.deploy_webhook_secret] }}
        run: curl -fsS -X POST "$WEBHOOK_URL"
