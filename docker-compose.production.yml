services:
  api:
    image: ghcr.io/mariokreitz/kreitz-webdev/api:latest
    pull_policy: always
    environment:
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
      PORTAL_PORT: ${PORTAL_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS}
      TRUST_PROXY: ${TRUST_PROXY}
      PROXY_HOPS: ${PROXY_HOPS}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      ARCJET_KEY: ${ARCJET_KEY}
      ARCJET_TRUSTED_PROXIES: ${ARCJET_TRUSTED_PROXIES}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:'+(process.env.API_PORT||3000)+'/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kreitz_webdev}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
