<canvas #canvas class="block h-full w-full" aria-hidden="true"></canvas>

@for (skill of config().skills; track skill.name) {
  <button
    #skillButton
    type="button"
    class="group pointer-events-auto absolute top-0 left-0 flex h-9 w-9 items-center justify-center rounded-[42%_58%_65%_35%/45%_35%_65%_55%] border border-(--accent)/55 bg-(--accent)/14 text-base text-(--accent) shadow-[0_0_16px_-4px_var(--accent)] transition-opacity duration-200 will-change-transform focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--accent)] sm:h-11 sm:w-11 sm:text-lg 2xl:h-12 2xl:w-12 2xl:text-xl"
    [class.opacity-0]="!ready()"
    [ngStyle]="{ '--accent': accentValue(skill) }"
    [attr.aria-label]="skill.name"
    [kwdUiTooltip]="skill.name"
    (mouseenter)="onSkillPointerEnter($index)"
    (mouseleave)="onSkillPointerLeave($index)"
    (focus)="onSkillFocus($index)"
    (blur)="onSkillBlur($index)">
    <span
      class="flex h-full w-full items-center justify-center transition-[scale] duration-200 group-hover:scale-110 group-focus-visible:scale-110">
      @if (skill.icon.kind === 'brand') {
        <kwd-ui-brand-icon [path]="skill.icon.path" [viewBox]="skill.icon.viewBox" />
      } @else {
        <fa-icon [icon]="skill.icon.icon" [attr.aria-hidden]="true" />
      }
    </span>
  </button>
}
