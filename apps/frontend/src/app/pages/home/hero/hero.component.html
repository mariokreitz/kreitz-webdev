<section #heroSection class="relative flex min-h-[70vh] w-full flex-col justify-center overflow-hidden">
  <kwd-frontend-constellation-background class="z-0" [config]="effectiveConfig()" [theme]="theme()" />

  <div
    class="pointer-events-none relative z-10 mx-auto flex w-full max-w-(--spacing-max-width) flex-col gap-6 px-(--spacing-margin-mobile) pt-40 pb-32 sm:px-(--spacing-margin-desktop) sm:pt-28 sm:pb-24 2xl:pt-32 2xl:pb-28">
    <div
      #heroText
      class="pointer-events-auto relative z-10 grid max-w-xl grid-cols-1 items-center gap-6 sm:max-w-2xl sm:grid-cols-[auto_1fr] sm:gap-8">
      <div class="flex flex-col gap-8">
        <p class="text-label-caps text-(--color-primary)">{{ 'hero.role' | translate }}</p>

        <div class="flex gap-4">
          <img
            alt="Mario Kreitz"
            class="h-20 w-20 rounded-full object-cover ring-1 ring-(--color-outline-variant) sm:h-24 sm:w-24"
            height="200"
            ngSrc="assets/images/me_pp.jpeg"
            priority
            width="200" />

          <h1 class="text-headline-lg text-(--color-on-surface) sm:text-6xl 2xl:text-7xl flex items-center">
            Mario Kreitz
          </h1>
        </div>

        <p class="max-w-2xl text-body-md text-(--color-on-surface-variant)">
          {{ 'hero.tagline' | translate }}
        </p>

        <p class="max-w-2xl text-body-md text-(--color-on-surface-variant)">
          {{ 'hero.introduction' | translate }}
        </p>

        @if (cvAvailable()) {
          <div class="flex flex-wrap items-center gap-4 pt-2">
            <a
              class="inline-flex items-center gap-2 rounded-(--radius-lg) bg-(--color-primary) px-5 py-2.5 text-body-sm font-medium text-(--color-on-primary) transition-opacity hover:opacity-90"
              data-umami-event="cv-download-link"
              href="/api/cv/download">
              <fa-icon [attr.aria-hidden]="true" [icon]="downloadIcon" />
              {{ 'hero.downloadCv' | translate }}
            </a>
          </div>
        }
      </div>
    </div>
  </div>

  <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 bottom-6 z-10 flex justify-center sm:bottom-10">
    <fa-icon
      class="text-lg text-(--color-on-surface-variant)/60 motion-safe:animate-bounce motion-reduce:animate-none"
      [icon]="scrollHintIcon" />
  </div>
</section>
