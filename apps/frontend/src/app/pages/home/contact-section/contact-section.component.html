<section class="section-glow-contact bg-(--color-surface-raised) py-16 2xl:py-24" id="contact">
  <div
    class="mx-auto flex max-w-(--spacing-max-width) flex-col gap-6 px-(--spacing-margin-mobile) sm:px-(--spacing-margin-desktop)">
    <div class="flex flex-col gap-2">
      <h2 class="text-headline-md text-(--color-on-surface)">{{ 'contactForm.heading' | translate }}</h2>
      <p class="max-w-prose text-body-md text-(--color-on-surface-variant)">
        {{ 'contactForm.subheading' | translate }}
      </p>
    </div>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-[1.2fr_1fr] lg:items-start">
      <div
        class="rounded-(--radius-lg) border border-(--color-outline-variant) bg-(--color-surface-container-low) p-5 sm:p-6">
        <kwd-frontend-contact-form [status]="status()" (submitted)="onSubmit($event)" />
      </div>

      <div class="flex flex-col gap-5">
        @if (emailLink(); as email) {
          <p class="text-body-sm text-(--color-on-surface-variant)">
            {{ 'contactForm.availability.directEmail' | translate }}
            <a
              class="font-medium text-(--color-on-surface) underline decoration-(--color-outline-variant) underline-offset-4 hover:text-(--color-primary)"
              data-umami-event="contact-direct-email"
              [href]="hrefFor(email)">
              {{ emailAddressFor(email) }}
            </a>
          </p>
        }
      </div>
    </div>
  </div>
</section>
