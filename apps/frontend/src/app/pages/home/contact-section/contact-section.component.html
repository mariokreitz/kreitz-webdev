<section
  id="contact"
  class="mx-auto flex max-w-(--spacing-max-width) flex-col gap-6 px-(--spacing-margin-mobile) py-16 sm:px-(--spacing-margin-desktop) 2xl:py-24">
  <div class="flex flex-col gap-2">
    <h2 class="text-headline-md text-(--color-on-surface)">{{ 'contactForm.heading' | translate }}</h2>
    <p class="max-w-prose text-body-md text-(--color-on-surface-variant)">
      {{ 'contactForm.subheading' | translate }}
    </p>
  </div>

  <div class="max-w-2xl">
    <kwd-frontend-contact-form [status]="status()" (submitted)="onSubmit($event)" />
  </div>
</section>
