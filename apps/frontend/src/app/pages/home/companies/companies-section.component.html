<section id="companies" class="bg-(--color-surface-container-low) py-16 2xl:py-24">
  <div class="mx-auto max-w-(--spacing-max-width) px-(--spacing-margin-mobile) sm:px-(--spacing-margin-desktop)">
    <div class="flex flex-col gap-2">
      <h2 class="text-headline-md text-(--color-on-surface)">{{ 'companies.heading' | translate }}</h2>
      <p class="max-w-prose text-body-md text-(--color-on-surface-variant)">
        {{ 'companies.description' | translate }}
      </p>
    </div>

    @if (companies().length) {
      <ul
        class="mt-8 flex flex-wrap items-center justify-center gap-x-5 gap-y-6 sm:gap-x-9"
        role="list"
        [attr.aria-label]="'companies.heading' | translate">
        @for (company of companies(); track company.id) {
          <li class="shrink-0">
            <kwd-frontend-company-logo [company]="company" />
          </li>
        }
      </ul>
    } @else {
      <p class="mt-6 text-body-md text-(--color-on-surface-variant)">{{ 'companies.comingSoon' | translate }}</p>
    }
  </div>
</section>
