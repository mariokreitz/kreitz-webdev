@if (companies().length) {
  <section
    id="companies"
    class="mx-auto max-w-(--spacing-max-width) px-(--spacing-margin-mobile) py-16 sm:px-(--spacing-margin-desktop) 2xl:py-24">
    <div class="flex flex-col gap-2">
      <h2 class="text-headline-md text-(--color-on-surface)">{{ 'companies.heading' | translate }}</h2>
      <p class="max-w-prose text-body-md text-(--color-on-surface-variant)">
        {{ 'companies.description' | translate }}
      </p>
    </div>

    <ol
      class="relative mt-8 flex max-w-2xl flex-col gap-10 before:absolute before:inset-y-2 before:left-[17px] before:w-px before:bg-(--color-outline-variant) before:content-['']"
      role="list"
      [attr.aria-label]="'companies.heading' | translate">
      @for (company of companies(); track company.id) {
        <kwd-frontend-company-row [company]="company" />
      }
    </ol>
  </section>
}
