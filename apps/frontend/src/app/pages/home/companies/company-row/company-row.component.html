<li class="flex items-center gap-4 py-3">
  @if (company().logoUrl) {
    <div class="relative size-10 shrink-0 overflow-hidden rounded-(--radius-sm)">
      <img class="object-contain" fill [ngSrc]="company().logoUrl ?? ''" [alt]="company().name" />
    </div>
  }

  <div class="flex flex-1 flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
    <div class="flex flex-col">
      <span class="text-body-md text-(--color-on-surface)">{{ company().name }}</span>
      @if (company().role) {
        <span class="text-code-sm text-(--color-on-surface-variant)">{{ company().role }}</span>
      }
    </div>

    @if (dateRange()) {
      <span class="text-code-sm text-(--color-on-surface-variant)">{{ dateRange() }}</span>
    }
  </div>
</li>
