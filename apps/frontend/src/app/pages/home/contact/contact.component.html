<footer
  id="contact"
  class="mx-auto flex max-w-(--spacing-max-width) flex-col gap-4 border-t border-(--color-outline-variant) px-(--spacing-margin-mobile) py-16 sm:flex-row sm:items-center sm:justify-between sm:px-(--spacing-margin-desktop) 2xl:py-24">
  <div class="flex flex-wrap gap-x-6 gap-y-2 text-body-sm text-(--color-on-surface-variant)">
    <a class="hover:text-(--color-on-surface)" href="mailto:mario.kreitz@web.de" data-umami-event="email-link">
      mario.kreitz&#64;web.de
    </a>
    <a
      class="hover:text-(--color-on-surface)"
      href="https://github.com/mariokreitz"
      target="_blank"
      rel="noopener noreferrer"
      data-umami-event="github-link">
      GitHub
    </a>
    <a
      class="hover:text-(--color-on-surface)"
      href="https://www.linkedin.com/in/mario-kreitz/"
      target="_blank"
      rel="noopener noreferrer"
      data-umami-event="linkedin-link">
      LinkedIn
    </a>
    <a class="hover:text-(--color-on-surface)" routerLink="/imprint" data-umami-event="imprint-link">
      {{ 'contact.links.imprint' | translate }}
    </a>
    <a class="hover:text-(--color-on-surface)" routerLink="/privacy-policy" data-umami-event="privacy-policy-link">
      {{ 'contact.links.privacyPolicy' | translate }}
    </a>
  </div>

  <p class="text-code-sm text-(--color-on-surface-variant)">&copy; {{ currentYear }} Mario Kreitz</p>
</footer>
