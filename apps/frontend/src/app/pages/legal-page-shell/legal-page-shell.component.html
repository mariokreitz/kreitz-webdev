<main
  class="mx-auto flex min-h-screen max-w-(--spacing-max-width) flex-col gap-10 px-(--spacing-margin-mobile) pt-32 pb-24 sm:px-(--spacing-margin-desktop) 2xl:pt-40 2xl:pb-32">
  <a
    class="-m-2.5 inline-flex w-fit items-center gap-2 p-2.5 text-body-sm text-(--color-primary) hover:underline"
    routerLink="/">
    <fa-icon [icon]="faArrowLeft" />
    {{ 'common.backToHome' | translate }}
  </a>

  <ng-content />
</main>
