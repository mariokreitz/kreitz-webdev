<nav
  id="site-nav"
  aria-label="Primary"
  [class]="
    `group fixed top-4 left-1/2 z-50 flex w-fit max-w-[calc(100%-2rem)] -translate-x-1/2 items-center gap-3 overflow-hidden rounded-(--radius-full) border border-(--color-outline-variant) bg-(--color-surface-container)/80 px-2 py-2 backdrop-blur-xl backdrop-saturate-150 transition-[box-shadow,scale,background-color,border-color] duration-500 ease-(--ease-spring) motion-reduce:transition-none animate-[nav-island-enter_0.6s_cubic-bezier(0.16,1,0.3,1)_both] motion-reduce:animate-none motion-safe:hover:animate-[nav-island-spring_0.7s_var(--ease-out-expo)_1] motion-safe:focus-within:animate-[nav-island-spring_0.7s_var(--ease-out-expo)_1] active:scale-[0.99] focus-within:shadow-xl motion-reduce:shadow-xl pointer-coarse:shadow-xl sm:gap-4 sm:px-2.5 ${scrolled() ? 'shadow-xl' : 'shadow-lg'}`
  ">
  <a
    routerLink="/"
    class="relative z-10 flex shrink-0 items-center gap-2 rounded-(--radius-full) transition-transform duration-300 ease-(--ease-spring) motion-reduce:transition-none hover:brightness-110 active:scale-95 motion-reduce:active:scale-100">
    <span class="grid h-11 w-11 shrink-0 place-items-center overflow-hidden rounded-(--radius-full)">
      <kwd-frontend-blip-mascot [bouncing]="navBounce()" [theme]="theme()" />
    </span>
    <span
      [class]="
        `overflow-hidden text-body-sm font-medium whitespace-nowrap text-(--color-on-surface) transition-[max-width,opacity] duration-(--duration-panel-expand) ease-(--ease-spring) motion-reduce:transition-none group-hover:max-w-16 group-hover:opacity-100 group-focus-within:max-w-16 group-focus-within:opacity-100 motion-reduce:max-w-16 motion-reduce:opacity-100 pointer-coarse:max-w-16 pointer-coarse:opacity-100 ${scrolled() ? 'max-w-16 opacity-100' : 'max-w-0 opacity-0'}`
      ">
      Home
    </span>
  </a>

  <div
    [class]="
      `flex min-w-0 items-center gap-3 overflow-hidden transition-[max-width,opacity] duration-(--duration-panel-expand) ease-(--ease-spring) motion-reduce:transition-none group-hover:max-w-[180px] group-hover:opacity-100 group-focus-within:max-w-[180px] group-focus-within:opacity-100 motion-reduce:max-w-[180px] motion-reduce:opacity-100 pointer-coarse:max-w-[180px] pointer-coarse:opacity-100 sm:gap-4 ${scrolled() ? 'max-w-[180px] opacity-100' : 'max-w-0 opacity-0'}`
    ">
    <a
      routerLink="/"
      fragment="projects"
      [class]="
        `relative inline-flex items-center py-1 text-body-sm font-medium whitespace-nowrap transition-[color,scale] duration-200 motion-reduce:transition-none hover:opacity-80 active:scale-95 motion-reduce:active:scale-100 ${isSectionActive('projects') ? 'text-(--color-primary)' : 'text-(--color-on-surface)'}`
      "
      (mouseenter)="onNavLinkPointerEnter($event)"
      (mouseleave)="onNavLinkPointerLeave()"
      (click)="onNavLinkClick()">
      Projects
      <span
        class="pointer-events-none absolute inset-x-0 -bottom-0.5 h-0.5 origin-center scale-x-0 rounded-full bg-(--color-primary) transition-transform duration-300 motion-reduce:transition-none"
        [class.scale-x-100]="isSectionActive('projects')"></span>
    </a>

    <a
      routerLink="/"
      fragment="contact"
      [class]="
        `relative inline-flex items-center py-1 text-body-sm font-medium whitespace-nowrap transition-[color,scale] duration-200 motion-reduce:transition-none hover:opacity-80 active:scale-95 motion-reduce:active:scale-100 ${isSectionActive('contact') ? 'text-(--color-primary)' : 'text-(--color-on-surface)'}`
      "
      (mouseenter)="onNavLinkPointerEnter($event)"
      (mouseleave)="onNavLinkPointerLeave()"
      (click)="onNavLinkClick()">
      Contact
      <span
        class="pointer-events-none absolute inset-x-0 -bottom-0.5 h-0.5 origin-center scale-x-0 rounded-full bg-(--color-primary) transition-transform duration-300 motion-reduce:transition-none"
        [class.scale-x-100]="isSectionActive('contact')"></span>
    </a>
  </div>

  @if (cvAvailable()) {
    <div
      [class]="
        `flex min-w-0 items-center overflow-hidden transition-[max-width,opacity] duration-(--duration-panel-expand) ease-(--ease-spring) motion-reduce:transition-none group-hover:max-w-20 group-hover:opacity-100 group-focus-within:max-w-20 group-focus-within:opacity-100 motion-reduce:max-w-20 motion-reduce:opacity-100 pointer-coarse:max-w-20 pointer-coarse:opacity-100 ${scrolled() ? 'max-w-20 opacity-100' : 'max-w-0 opacity-0'}`
      ">
      <a
        href="/api/cv/download"
        class="relative z-10 flex h-9 shrink-0 items-center gap-2 rounded-(--radius-full) text-(--color-on-surface) transition-[color,scale] duration-200 motion-reduce:transition-none hover:text-(--color-primary) hover:opacity-80 active:scale-95 motion-reduce:active:scale-100">
        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-(--radius-full)">
          <fa-icon class="text-sm" [icon]="downloadIcon" />
        </span>
        <span class="text-body-sm font-medium whitespace-nowrap">CV</span>
      </a>
    </div>
  }
</nav>
