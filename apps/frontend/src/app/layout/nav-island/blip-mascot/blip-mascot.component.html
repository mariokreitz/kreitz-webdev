<svg class="h-full w-full" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="blip-body-gradient" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="color-mix(in srgb, var(--color-primary) 58%, white 42%)" />
      <stop offset="55%" stop-color="var(--color-primary)" />
      <stop offset="100%" stop-color="color-mix(in srgb, var(--color-primary) 78%, black 22%)" />
    </radialGradient>
    <linearGradient id="blip-shine-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.55" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle class="blip-body" cx="22" cy="22" r="21" fill="url(#blip-body-gradient)" />
  <ellipse cx="15.5" cy="12.5" rx="10.5" ry="6.5" fill="url(#blip-shine-gradient)" opacity="0.8" />

  <g class="blip-face">
    <g
      class="blip-eyes"
      [class.is-blinking]="eyeState() === 'blinking'"
      [class.is-squinting]="eyeState() === 'squinting'"
      [class.is-sleepy]="eyeState() === 'sleepy'">
      <rect x="12.4" y="17.3" width="6.6" height="9.2" rx="3.3" fill="var(--color-on-primary)" />
      <rect x="25" y="17.3" width="6.6" height="9.2" rx="3.3" fill="var(--color-on-primary)" />
      <circle cx="14.6" cy="19.8" r="1.05" fill="white" fill-opacity="0.6" />
      <circle cx="27.2" cy="19.8" r="1.05" fill="white" fill-opacity="0.6" />
    </g>
    <path
      class="blip-mouth"
      stroke="var(--color-on-primary)"
      stroke-width="2.1"
      stroke-linecap="round"
      fill="none"
      [attr.d]="mouthPath()" />
  </g>

  <circle
    class="blip-spark"
    cx="34.5"
    cy="9.5"
    r="2.1"
    fill="var(--color-secondary)"
    opacity="0.85"
    [class.is-twinkling]="eyeState() === 'sleepy'" />
</svg>
