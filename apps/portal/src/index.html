<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>portal</title>
    <base href="/" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="#10141a" name="theme-color" media="(prefers-color-scheme: dark)" />
    <meta content="#f7f9fd" name="theme-color" media="(prefers-color-scheme: light)" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="Kreitz WebDev" name="apple-mobile-web-app-title" />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <link href="favicon-32x32.png" rel="icon" type="image/png" sizes="32x32" />
    <link href="apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('kwd-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <kwd-portal-root></kwd-portal-root>
  </body>
</html>
