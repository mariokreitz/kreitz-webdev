<div
  class="login-shell flex min-h-screen items-center justify-center bg-[var(--color-background)] px-4 py-8 text-[var(--color-on-background)]">
  <div
    class="w-full max-w-md rounded-[var(--radius-lg)] border border-[var(--color-outline)] bg-[var(--color-surface-container)] p-6 sm:p-8">
    <div class="mb-6">
      <h1 class="text-2xl font-semibold tracking-[-0.03em] text-[var(--color-on-surface)]">
        {{ mode() === 'register' ? 'Create an account' : 'Sign in' }}
      </h1>
    </div>

    @if (infoMessage()) {
      <p
        class="mb-4 rounded-[var(--radius-md)] border border-[var(--color-outline)] bg-[var(--color-surface-container-low)] px-3 py-2 text-sm text-[var(--color-on-surface)]">
        {{ infoMessage() }}
      </p>
    }

    <kwd-portal-auth-form
      [errorMessage]="errorMessage()"
      [loading]="loading()"
      [mode]="mode()"
      (githubLogin)="onGithubLogin()"
      (login)="onLogin($event)"
      (register)="onRegister($event)"
      (toggleMode)="onToggleMode()" />
  </div>
</div>
