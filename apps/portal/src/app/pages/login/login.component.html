<div
  class="login-shell flex min-h-dvh flex-col items-center justify-center gap-6 bg-(--color-background) px-4 py-8 text-(--color-on-background)">
  <kwd-ui-card>
    <div class="login-card-header mb-6">
      <h1 class="text-headline-md text-(--color-on-surface)">
        {{ (mode() === 'register' ? 'auth.heading.register' : 'auth.heading.login') | translate }}
      </h1>
    </div>

    @if (infoMessage()) {
      <p
        class="mb-4 rounded-(--radius) border border-(--color-primary)/30 bg-(--color-primary)/10 px-3 py-2 text-body-sm text-(--color-on-surface)">
        {{ infoMessage() }}
      </p>
    }

    <kwd-portal-auth-form
      [errorMessage]="errorMessage()"
      [loading]="loading()"
      [mode]="mode()"
      (githubLogin)="onGithubLogin()"
      (login)="onLogin($event)"
      (register)="onRegister($event)"
      (toggleMode)="onToggleMode()" />
  </kwd-ui-card>
</div>
