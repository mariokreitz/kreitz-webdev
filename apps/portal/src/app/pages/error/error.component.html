<div class="flex min-h-screen items-center justify-center bg-(--color-background) px-4">
  <kwd-ui-card variant="narrow">
    <div class="text-center">
      <h1 class="text-headline-md text-(--color-on-surface)">{{ 'error.title' | translate }}</h1>
      <p class="mt-2 text-body-sm text-(--color-on-surface-variant)">{{ message() | translate }}</p>

      <kwd-portal-error-diagnostics
        [requestId]="requestId()"
        [statusCode]="statusCode()"
        [timestamp]="timestamp()"
        [path]="path()" />

      <a
        class="mt-6 inline-block rounded-(--radius-md) bg-secondary-500 px-4 py-2.5 text-label-caps uppercase text-on-secondary-container transition-colors hover:bg-secondary-400"
        routerLink="/login">
        {{ 'common.backToSignIn' | translate }}
      </a>
    </div>
  </kwd-ui-card>
</div>
