@if (entries().length > 0) {
  <dl class="mt-6 space-y-1 rounded-(--radius-md) bg-(--color-surface-container) p-3 text-left">
    @for (entry of entries(); track entry.label) {
      <div class="flex justify-between gap-4 text-code-sm text-(--color-on-surface-variant)">
        <dt>{{ entry.label | translate }}</dt>
        <dd class="truncate">{{ entry.value }}</dd>
      </div>
    }
  </dl>
}
