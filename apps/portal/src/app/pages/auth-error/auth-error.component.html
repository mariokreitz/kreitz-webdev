<div class="flex min-h-screen items-center justify-center bg-(--color-background) px-4">
  <kwd-ui-card>
    <div class="text-center">
      <h1 class="text-headline-md text-(--color-on-surface)">Sign-in failed</h1>
      <p class="mt-2 text-body-sm text-(--color-on-surface-variant)">
        Something went wrong while signing you in. Please try again.
      </p>

      @if (errorLabel(); as label) {
        <p class="mt-4 text-code-sm text-(--color-on-surface-variant)">
          Error code: <code>{{ label }}</code>
        </p>
      }

      <a
        class="mt-6 inline-block rounded-(--radius-md) bg-secondary-500 px-4 py-2.5 text-label-caps uppercase text-on-secondary-container transition-colors hover:bg-secondary-400"
        routerLink="/login">
        Back to sign in
      </a>
    </div>
  </kwd-ui-card>
</div>
