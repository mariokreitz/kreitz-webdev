<div
  class="mt-3 flex flex-col gap-3 rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-lowest) p-4">
  <h3 class="text-body-md font-medium text-(--color-on-surface)">
    {{ 'websites.domains.instructions.title' | translate }}
  </h3>
  <p class="text-body-sm text-(--color-on-surface-variant)">
    {{ 'websites.domains.instructions.description' | translate }}
  </p>

  <div class="flex flex-col gap-1">
    <span class="font-mono text-label-caps uppercase text-(--color-on-surface-variant)">{{
      'websites.domains.instructions.filePath' | translate
    }}</span>
    <code
      class="overflow-x-auto rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-low) px-3 py-2.5 text-code-sm text-(--color-on-surface)"
      >{{ wellKnownUrl() }}</code
    >
  </div>

  <div class="flex items-center gap-2">
    <code
      class="flex-1 overflow-x-auto rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-low) px-3 py-2.5 text-code-sm text-(--color-on-surface)"
      >{{ token() }}</code
    >
    <button
      class="flex shrink-0 items-center gap-2 rounded-(--radius) border border-(--color-outline-variant) px-3 py-2.5 text-code-sm uppercase text-(--color-on-surface) transition-colors hover:border-(--color-primary)"
      type="button"
      (click)="onCopyToken()">
      <fa-icon [icon]="copyIcon" />
      {{ (copied() ? 'websites.actions.copied' : 'websites.domains.instructions.copyToken') | translate }}
    </button>
  </div>
</div>
