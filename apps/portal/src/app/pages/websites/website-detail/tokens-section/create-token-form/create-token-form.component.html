<form class="flex flex-wrap items-end gap-3" (submit)="onSubmit($event)">
  <div class="flex flex-1 min-w-[10rem] flex-col gap-2">
    <label class="font-mono text-label-caps uppercase text-(--color-on-surface-variant)" for="token-name">{{
      'websites.tokens.form.name' | translate
    }}</label>
    <input
      autocomplete="off"
      class="rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-lowest) px-3 py-2.5 font-mono text-code-md text-(--color-on-surface) outline-none transition-colors focus:border-(--color-primary)"
      id="token-name"
      type="text"
      [formField]="tokenForm.name" />
    @if (tokenForm.name().touched() && tokenForm.name().errors().length) {
      <p class="min-h-[1.25rem] text-body-sm text-(--color-error)">
        {{ tokenForm.name().errors()[0]?.message | translate }}
      </p>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label class="font-mono text-label-caps uppercase text-(--color-on-surface-variant)" for="token-expires">{{
      'websites.tokens.form.expiresAt' | translate
    }}</label>
    <input
      class="rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-lowest) px-3 py-2.5 font-mono text-code-md text-(--color-on-surface) outline-none transition-colors focus:border-(--color-primary)"
      id="token-expires"
      type="date"
      [formField]="tokenForm.expiresAt" />
  </div>

  <kwd-ui-button
    [label]="'websites.tokens.add' | translate"
    [loadingLabel]="'websites.tokens.form.creating' | translate"
    [disabled]="tokenForm().invalid() || loading()"
    [icon]="submitIcon"
    [loading]="loading()" />

  <button
    class="rounded-(--radius-sm) px-4 py-2.5 text-label-caps uppercase text-(--color-on-surface-variant) transition-colors hover:text-(--color-on-surface) disabled:cursor-not-allowed disabled:opacity-60"
    type="button"
    [disabled]="loading()"
    (click)="onCancel()">
    <fa-icon [icon]="cancelIcon" />
    {{ 'common.cancel' | translate }}
  </button>
</form>
