@if (token(); as revealed) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" role="presentation">
    <div
      class="w-full max-w-md rounded-(--radius-lg) border border-(--color-outline-variant) bg-(--color-surface-container-low) p-6"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="'websites.tokens.reveal.title' | translate">
      <h2 class="text-headline-md text-(--color-on-surface)">{{ 'websites.tokens.reveal.title' | translate }}</h2>

      <div class="mt-3 flex items-start gap-2 rounded-(--radius) border border-(--color-warning) p-3">
        <fa-icon class="mt-0.5 shrink-0 text-(--color-warning)" [icon]="warningIcon" />
        <p class="text-body-sm text-(--color-on-surface)">{{ 'websites.tokens.reveal.warning' | translate }}</p>
      </div>

      <p class="mt-4 text-body-sm text-(--color-on-surface-variant)">{{ revealed.name }}</p>

      <div class="mt-2 flex items-center gap-2">
        <code
          class="flex-1 overflow-x-auto rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-lowest) px-3 py-2.5 text-code-sm text-(--color-on-surface)"
          >{{ revealed.token }}</code
        >
        <button
          class="flex shrink-0 items-center gap-2 rounded-(--radius) border border-(--color-outline-variant) px-3 py-2.5 text-code-sm uppercase text-(--color-on-surface) transition-colors hover:border-(--color-primary)"
          type="button"
          (click)="onCopy()">
          <fa-icon [icon]="copyIcon" />
          {{ (copied() ? 'websites.actions.copied' : 'websites.actions.copy') | translate }}
        </button>
      </div>

      <p class="mt-3 text-body-sm text-(--color-on-surface-variant)">
        {{ 'websites.tokens.reveal.neverShownAgain' | translate }}
      </p>

      <div class="mt-6 flex justify-end">
        <button
          class="rounded-(--radius) bg-secondary-500 px-4 py-2.5 font-mono text-label-caps uppercase text-on-secondary-container transition-colors hover:-translate-y-px hover:bg-secondary-400"
          type="button"
          (click)="onClose()">
          {{ 'websites.actions.close' | translate }}
        </button>
      </div>
    </div>
  </div>
}
