<section class="mx-auto flex max-w-2xl flex-col gap-6">
  <div>
    <a class="text-body-sm text-(--color-primary) hover:underline" routerLink="/projects">{{
      'projects.backToList' | translate
    }}</a>
    <h1 class="mt-2 text-headline-lg text-(--color-on-surface)">{{ 'projects.create.title' | translate }}</h1>
    <p class="mt-1 text-body-md text-(--color-on-surface-variant)">{{ 'projects.create.subtitle' | translate }}</p>
  </div>

  <kwd-ui-card>
    <kwd-portal-project-form
      mode="create"
      [loading]="loading()"
      [errorMessage]="errorMessage()"
      (formSubmitted)="onFormSubmitted($event)" />
  </kwd-ui-card>
</section>
