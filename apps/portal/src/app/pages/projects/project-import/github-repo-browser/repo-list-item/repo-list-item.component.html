<div class="flex items-center justify-between gap-4 border-b border-(--color-outline-variant) py-3 last:border-0">
  <div class="min-w-0">
    <div class="flex items-center gap-2">
      <span class="truncate text-body-md text-(--color-on-surface)">{{ repo().fullName }}</span>
      @if (repo().private) {
        <fa-icon
          class="shrink-0 text-(--color-on-surface-variant)"
          [icon]="lockIcon"
          [attr.aria-label]="'projects.import.private' | translate" />
      }
    </div>
    @if (repo().description) {
      <p class="mt-0.5 truncate text-body-sm text-(--color-on-surface-variant)">{{ repo().description }}</p>
    }
    @if (repo().language) {
      <span class="mt-1 inline-block text-code-sm text-(--color-on-surface-variant)">{{ repo().language }}</span>
    }
  </div>

  <button
    class="shrink-0 rounded-(--radius) border border-(--color-outline-variant) px-3 py-2 text-label-caps uppercase text-(--color-on-surface) transition-colors enabled:hover:bg-(--color-surface-container-highest) disabled:cursor-not-allowed disabled:opacity-60"
    type="button"
    [disabled]="disabled() || importing()"
    (click)="onImportClick()">
    {{ importing() ? ('projects.import.importing' | translate) : ('projects.import.action' | translate) }}
  </button>
</div>
