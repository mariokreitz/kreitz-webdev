<div class="flex flex-col gap-4">
  <input
    class="rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-lowest) px-3 py-2.5 font-mono text-code-md text-(--color-on-surface) outline-none transition-colors placeholder:text-(--color-on-surface-variant) focus:border-(--color-primary)"
    type="search"
    [value]="searchQuery()"
    [placeholder]="'projects.import.searchPlaceholder' | translate"
    (input)="onSearchInput($event)" />

  @if (isLoading()) {
    <kwd-ui-skeleton variant="activity" [rows]="5" />
  } @else if (isError()) {
    <p class="text-body-sm text-(--color-error)">{{ 'projects.import.loadError' | translate }}</p>
  } @else if (filteredRepos().length === 0) {
    <p class="text-body-sm text-(--color-on-surface-variant)">{{ 'projects.import.empty' | translate }}</p>
  } @else {
    <div class="max-h-96 overflow-y-auto rounded-(--radius) border border-(--color-outline-variant) px-4">
      @for (repo of filteredRepos(); track repo.githubId) {
        <kwd-portal-repo-list-item
          [repo]="repo"
          [importing]="importingRepoId() === repo.githubId"
          [disabled]="importingRepoId() !== null && importingRepoId() !== repo.githubId"
          (importClicked)="onImportClick($event)" />
      }
    </div>
  }
</div>
