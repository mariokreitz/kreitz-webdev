<div class="flex min-h-screen items-center justify-center bg-[var(--color-surface-muted)] px-4">
  <div class="w-full max-w-sm rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm">
    <h1 class="text-center text-xl font-semibold text-[var(--color-text)]">Dashboard</h1>
    <p class="mt-2 text-center text-sm text-[var(--color-text-muted)]">You're signed in. This is a placeholder.</p>

    <button
      class="mt-6 w-full rounded-md bg-brand-600 px-4 py-2 font-medium text-white transition-colors hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-50"
      type="button"
      [disabled]="loggingOut()"
      (click)="onLogout()">
      {{ loggingOut() ? 'Signing out…' : 'Sign out' }}
    </button>
  </div>
</div>
