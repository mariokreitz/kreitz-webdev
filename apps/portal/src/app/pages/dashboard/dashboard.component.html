<section class="flex flex-col gap-8">
  <div>
    <h1 class="text-headline-lg text-(--color-on-surface)">
      {{ 'dashboard.welcome' | translate: { name: greetingName() } }}
    </h1>
    <p class="mt-1 text-body-md text-(--color-on-surface-variant)">{{ 'dashboard.subtitle' | translate }}</p>
  </div>

  <kwd-portal-metrics-grid [metrics]="metrics()" />

  <kwd-ui-card>
    <div #activityViewportAnchor>
      @defer (on viewport(activityViewportAnchor)) {
        <kwd-portal-activity-feed [entries]="activity()" [loading]="isActivityLoading()" [error]="isActivityError()" />
      } @placeholder {
        <kwd-ui-skeleton variant="activity" [rows]="5" />
      } @loading (minimum 200ms) {
        <kwd-ui-skeleton variant="activity" [rows]="5" />
      }
    </div>
  </kwd-ui-card>
</section>
