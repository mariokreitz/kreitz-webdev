<div class="flex items-center gap-2">
  <fa-icon class="text-(--color-on-surface-variant)" [icon]="terminalIcon" />
  <h2 class="text-headline-md text-(--color-on-surface)">{{ 'profile.diagnostics.title' | translate }}</h2>
</div>

<dl class="mt-4 flex flex-col gap-3">
  @for (field of fields(); track field.label) {
    <div
      class="flex flex-col gap-1 border-b border-(--color-outline-variant) pb-3 last:border-0 last:pb-0 sm:flex-row sm:items-center sm:justify-between">
      <dt class="text-code-sm uppercase text-(--color-on-surface-variant)">{{ field.label | translate }}</dt>
      <dd class="text-body-sm text-(--color-on-surface)">{{ field.value }}</dd>
    </div>
  }
</dl>
