<section class="flex flex-col gap-8">
  <div>
    <h1 class="text-headline-lg text-(--color-on-surface)">{{ 'profile.title' | translate }}</h1>
    <p class="mt-1 text-body-md text-(--color-on-surface-variant)">
      {{ 'profile.subtitle' | translate }}
    </p>
  </div>

  <div class="grid grid-cols-1 gap-8 xl:grid-cols-3">
    <kwd-ui-card>
      <kwd-portal-identity-card
        [name]="displayName()"
        [email]="email()"
        [avatarUrl]="avatarUrl()"
        [emailVerified]="emailVerified()"
        [editDisabled]="isEditing()"
        (editRequested)="onEditRequested()" />

      @if (isEditing()) {
        <kwd-portal-edit-name-form
          [initialName]="displayName()"
          [loading]="saving()"
          [errorMessage]="errorMessage()"
          (nameSaved)="onSaveName($event)"
          (editCancelled)="onCancelEdit()" />
      }
    </kwd-ui-card>

    <kwd-ui-card>
      <kwd-portal-diagnostics-card [fields]="diagnostics()" />
    </kwd-ui-card>

    <kwd-ui-card>
      <kwd-portal-cv-card />
    </kwd-ui-card>

    <kwd-ui-card>
      <kwd-portal-danger-zone-card />
    </kwd-ui-card>
  </div>
</section>
