<form class="mt-4 flex flex-col gap-3 border-t border-(--color-outline-variant) pt-4" (submit)="onSubmit($event)">
  <div class="flex flex-col gap-2">
    <label class="font-mono text-label-caps uppercase text-(--color-on-surface-variant)" for="profile-name">{{
      'profile.editName.name' | translate
    }}</label>
    <input
      autocomplete="name"
      class="rounded-(--radius) border border-(--color-outline-variant) bg-(--color-surface-container-lowest) px-3 py-2.5 font-mono text-code-md text-(--color-on-surface) outline-none transition-colors placeholder:text-(--color-on-surface-variant) focus:border-(--color-primary)"
      id="profile-name"
      type="text"
      [formField]="nameForm.name" />
    @if (nameForm.name().touched() && nameForm.name().errors().length) {
      <p class="min-h-[1.25rem] text-body-sm text-(--color-error)">
        {{ nameForm.name().errors()[0]?.message | translate }}
      </p>
    } @else {
      <p class="min-h-[1.25rem]"></p>
    }
  </div>

  @if (errorMessage()) {
    <p class="min-h-[1.25rem] text-body-sm text-(--color-error)">{{ errorMessage() }}</p>
  } @else {
    <p class="min-h-[1.25rem]"></p>
  }

  <div class="flex items-center gap-3">
    <kwd-ui-button
      [label]="'common.save' | translate"
      [loadingLabel]="'profile.editName.saving' | translate"
      [disabled]="nameForm().invalid() || loading()"
      [icon]="saveIcon"
      [loading]="loading()" />

    <button
      class="rounded-(--radius-sm) px-4 py-2.5 text-label-caps uppercase text-(--color-on-surface-variant) transition-colors hover:text-(--color-on-surface) disabled:cursor-not-allowed disabled:opacity-60"
      type="button"
      [disabled]="loading()"
      (click)="onCancel()">
      <fa-icon [icon]="cancelIcon" />
      {{ 'common.cancel' | translate }}
    </button>
  </div>
</form>
