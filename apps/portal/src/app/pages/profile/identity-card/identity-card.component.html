<div class="flex flex-col items-center gap-4 text-center sm:flex-row sm:items-center sm:text-left">
  <div class="relative shrink-0">
    @if (resolvedAvatarUrl(); as avatarUrl) {
      <img
        class="h-20 w-20 rounded-full object-cover"
        width="80"
        height="80"
        [ngSrc]="avatarUrl"
        [alt]="name()"
        (error)="onAvatarError()" />
    } @else {
      <div
        class="flex h-20 w-20 items-center justify-center rounded-full bg-(--color-secondary-500) font-mono text-headline-md text-(--color-on-secondary-container)">
        {{ initials() }}
      </div>
    }

    @if (emailVerified()) {
      <span
        class="absolute -bottom-1 -right-1 flex h-6 w-6 items-center justify-center rounded-full bg-(--color-surface-container-low) text-(--color-primary)"
        [title]="'profile.identity.verifiedAccount' | translate">
        <fa-icon class="text-base" [icon]="verifiedIcon" />
      </span>
    }
  </div>

  <div class="flex flex-1 flex-col gap-1">
    <h1 class="text-headline-lg text-(--color-on-surface)">{{ name() }}</h1>
    <p class="text-body-md text-(--color-on-surface-variant)">{{ email() }}</p>
    <p class="mt-2 text-body-sm text-(--color-on-surface-variant)">
      {{ 'profile.identity.managedNotice' | translate }}
    </p>

    <button
      class="mt-3 self-center rounded-(--radius-sm) text-body-sm text-(--color-primary) underline-offset-2 transition-colors hover:text-(--color-primary-300) hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--color-primary) disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:no-underline sm:self-start"
      type="button"
      [disabled]="editDisabled()"
      (click)="onEditClick()">
      <fa-icon class="mr-1.5" [icon]="editIcon" />
      {{ 'profile.identity.editProfile' | translate }}
    </button>
  </div>
</div>
